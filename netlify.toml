[build]
  # Install the Chromium used by the prerender step (scripts/prerender.mjs), then
  # build. ';' (not '&&') so a browser-install hiccup never blocks the deploy —
  # prerendering is best-effort and falls back to CSR if Chromium is unavailable.
  command = "npx playwright install chromium; npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Install Playwright's Chromium into node_modules so Netlify caches it between
  # builds instead of re-downloading each time.
  PLAYWRIGHT_BROWSERS_PATH = "0"
  # VITE_GOOGLE_MAPS_API_KEY is a browser (public) key by design — Vite inlines
  # it into the client bundle, so Netlify's secrets scanner would otherwise fail
  # the build on finding it. It's secured by HTTP-referrer + API restrictions on
  # the Google Cloud side, not by secrecy, so exempting it from the scan is safe.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_MAPS_API_KEY"

[context.branch-deploy]
  command = "npm run build"

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + CSP
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com https://i.ytimg.com https://img.youtube.com https://www.google-analytics.com https://*.clarity.ms https://maps.googleapis.com https://maps.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://upload-widget.cloudinary.com https://widget.cloudinary.com https://maps.googleapis.com https://maps.gstatic.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://upload-widget.cloudinary.com https://widget.cloudinary.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.supabase.co wss://*.supabase.co https://*.clarity.ms https://api.cloudinary.com https://*.cloudinary.com https://maps.googleapis.com https://maps.gstatic.com https://places.googleapis.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://upload-widget.cloudinary.com https://*.cloudinary.com; worker-src 'self' blob:"


# Caching: keep index.html fresh; cache hashed assets long-term
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"