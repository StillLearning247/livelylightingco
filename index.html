            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Permanent outdoor lighting is a smart LED lighting system that stays installed year-round. We install the leading brands — Govee Pro, Govee Prism, Asahom, Eufy, and Enbrighten — using our premium PermTrack mounting system for a clean, professional look. Each system can be controlled via smartphone app to display any color, animation, or scene for holidays, sports, parties, or everyday accent lighting."

            "@type": "Question",

          },
          {
            "@type": "Question",
            "name": "How much does permanent lighting installation cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Permanent outdoor lighting installations typically range from $18 to $35 per linear foot of roofline, with most homes falling between $2,000 and $8,000+ depending on size, roof complexity, brand chosen (Govee Pro, Govee Prism, Asahom, Eufy, or Enbrighten), and number of stories. We offer free in-home consultations and a best price guarantee — we will beat any quote from Jellyfish, Trimlight, Oelo, Gemstone (Astoria), or EverLights."
            }
          },
          {
            "@type": "Question",
            "name": "How do Govee Pro, Govee Prism, Asahom, Eufy and Enbrighten compare to Trimlight, Jellyfish, or Gemstone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The smart-LED brands we install — Govee Pro, Govee Prism, Asahom, Eufy, and Enbrighten — deliver the same year-round, app-controlled experience as Trimlight, Jellyfish, Oelo, and Gemstone, at a significantly lower price point with deeper smart-home integration. All offer app-controlled scenes, music sync, and millions of color combinations, paired with our PermTrack mounting system and backed by a lifetime hardware warranty plus 5-year workmanship warranty."
            }
          },

            "@type": "Question",
            "name": "Are permanent Christmas lights the same as permanent outdoor lights?",
